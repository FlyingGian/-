name: Desktop verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      QT_QPA_PLATFORM: offscreen
      ASHAREQUANT_DATA: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-noto-cjk
      - run: python -m pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: python -m pip check
      - run: ruff check .
      - run: black --check .
      - run: python -m pytest --cov=domain --cov=application --cov=infrastructure --cov-fail-under=70 --cov-report=xml --junitxml=test-results.xml
      - run: python -m app --smoke --screenshot desktop.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            test-results.xml
            desktop.png
            ci-data/logs/
